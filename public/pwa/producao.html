<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produção — LKL Gráfica</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; min-height: 100vh; }
.topbar { background: #1a237e; color: #fff; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.topbar h1 { font-size: 18px; font-weight: 600; }
.btn-sair { background: rgba(255,255,255,0.2); color: #fff; border: none; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 14px; }
.btn-sair:hover { background: rgba(255,255,255,0.3); }
.tabs { display: flex; background: #fff; border-bottom: 2px solid #e0e0e0; }
.tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; font-size: 14px; font-weight: 500; color: #666; border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all 0.2s; }
.tab.active { color: #1a237e; border-bottom-color: #1a237e; }
.content { padding: 16px; }
.card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
.card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.card-os { font-weight: 700; font-size: 15px; color: #1a237e; }
.card-orc { font-size: 13px; color: #888; }
.badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; margin-left: auto; }
.badge-aguardando { background: #f5f5f5; color: #555; }
.badge-arte_final { background: #e8eaf6; color: #3949ab; }
.badge-impressao { background: #e3f2fd; color: #0277bd; }
.badge-acabamento { background: #fff3e0; color: #e65100; }
.badge-embalagem { background: #f3e5f5; color: #6a1b9a; }
.badge-pronto { background: #e8f5e9; color: #2e7d32; }
.badge-entregue { background: #1a237e; color: #fff; }
.card-desc { font-size: 16px; font-weight: 600; color: #212121; margin-bottom: 8px; }
.card-info { font-size: 13px; color: #666; margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
.card-info span { background: #f5f5f5; padding: 3px 8px; border-radius: 6px; }
.btn-advance { width: 100%; padding: 14px; background: #1a237e; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
.btn-advance:hover { background: #283593; }
.btn-advance:disabled { background: #9e9e9e; cursor: not-allowed; }
.label-entregue { text-align: center; padding: 12px; color: #2e7d32; font-weight: 600; font-size: 15px; }
.loading { text-align: center; padding: 40px; color: #999; font-size: 14px; }
.empty { text-align: center; padding: 40px; color: #999; font-size: 14px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #323232; color: #fff; padding: 12px 24px; border-radius: 8px; font-size: 14px; z-index: 300; opacity: 0; transition: opacity 0.3s; pointer-events: none; text-align: center; max-width: 90vw; }
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="topbar">
  <h1>🖨️ Produção LKL</h1>
  <button class="btn-sair" onclick="logout()">Sair</button>
</div>

<div class="tabs">
  <div class="tab active" id="tab-andamento" onclick="switchTab('andamento')">Em Andamento</div>
  <div class="tab" id="tab-concluidas" onclick="switchTab('concluidas')">Concluídas</div>
</div>

<div class="content" id="content">
  <div class="loading">Carregando...</div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { requireAuth, api, logout, getUser } from '/pwa/app.js';
window.logout = logout;

const NEXT_STATUS = {
  aguardando: 'arte_final',
  arte_final: 'impressao',
  impressao: 'acabamento',
  acabamento: 'embalagem',
  embalagem: 'pronto',
  pronto: 'entregue',
};

const NEXT_LABEL = {
  aguardando: '▶ Iniciar Arte Final',
  arte_final: '▶ Enviar para Impressão',
  impressao: '▶ Iniciar Acabamento',
  acabamento: '▶ Enviar para Embalagem',
  embalagem: '▶ Marcar como Pronto',
  pronto: '▶ Confirmar Entrega',
};

const STATUS_LABEL = {
  aguardando: 'Aguardando',
  arte_final: 'Arte Final',
  impressao: 'Impressão',
  acabamento: 'Acabamento',
  embalagem: 'Embalagem',
  pronto: 'Pronto',
  entregue: 'Entregue',
};

const IN_PROGRESS = new Set(['aguardando','arte_final','impressao','acabamento','embalagem']);
const DONE = new Set(['pronto','entregue']);

let allOS = [];
let activeTab = 'andamento';

function showToast(msg, duration = 2500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}

async function loadOS() {
  try {
    const res = await api('/api/v2/os?limit=100');
    allOS = res.data || [];
    render();
  } catch (e) {
    document.getElementById('content').innerHTML = '<div class="empty">Erro ao carregar OSs.</div>';
  }
}

function render() {
  const filtered = allOS.filter(os => {
    if (activeTab === 'andamento') return IN_PROGRESS.has(os.status);
    if (activeTab === 'concluidas') return DONE.has(os.status);
    return false;
  });

  const content = document.getElementById('content');

  if (filtered.length === 0) {
    const msg = activeTab === 'andamento' ? 'Nenhuma OS em andamento.' : 'Nenhuma OS concluída.';
    content.innerHTML = `<div class="empty">${msg}</div>`;
    return;
  }

  content.innerHTML = filtered.map(os => {
    const badgeClass = `badge-${os.status}`;
    const statusLabel = STATUS_LABEL[os.status] || os.status;
    const nextStatus = NEXT_STATUS[os.status];
    const nextLabel = NEXT_LABEL[os.status];

    const infoParts = [];
    if (os.quantidade) infoParts.push(`Qtde: ${os.quantidade}`);
    if (os.tipo_insumo) infoParts.push(os.tipo_insumo);
    if (os.cores) infoParts.push(`Cores: ${os.cores}`);

    const infoHtml = infoParts.length
      ? `<div class="card-info">${infoParts.map(p => `<span>${p}</span>`).join('')}</div>`
      : '';

    let actionHtml = '';
    if (os.status === 'entregue') {
      actionHtml = `<div class="label-entregue">✅ Entregue</div>`;
    } else if (nextStatus) {
      actionHtml = `<button class="btn-advance" onclick="advanceOS(${os.id}, '${nextStatus}', this)">${nextLabel}</button>`;
    }

    return `
    <div class="card">
      <div class="card-header">
        <span class="card-os">OS #${os.numero_os}</span>
        <span class="card-orc">ORC #${os.numero_orcamento || '-'}</span>
        <span class="badge ${badgeClass}">${statusLabel}</span>
      </div>
      <div class="card-desc">${os.item_descricao || '—'}</div>
      ${infoHtml}
      ${actionHtml}
    </div>`;
  }).join('');
}

window.switchTab = function(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(`tab-${tab}`).classList.add('active');
  render();
};

window.advanceOS = async function(id, nextStatus, btn) {
  btn.disabled = true;
  try {
    await api(`/api/v2/os/${id}/status`, { method: 'PATCH', body: JSON.stringify({ status: nextStatus }) });
    showToast('Status atualizado!');
    await loadOS();
  } catch (e) {
    showToast('Erro ao atualizar status.');
    btn.disabled = false;
  }
};

async function init() {
  await requireAuth();
  const user = getUser();
  if (!user || !['admin','operador','atendente'].includes(user.role)) {
    window.location.href = '/pwa/login.html';
    return;
  }
  await loadOS();
  setInterval(loadOS, 30000);
}

init();
</script>
</body>
</html>
