<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LKL Gráfica — Login</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #1a237e 0%, #283593 60%, #0d47a1 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: white;
    border-radius: 16px;
    padding: 40px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .logo {
    text-align: center;
    margin-bottom: 32px;
  }
  .logo img { width: 140px; height: 140px; object-fit: contain; margin-bottom: 8px; }
  .logo p { color: #666; font-size: 14px; margin-top: 4px; }
  label { display: block; margin-bottom: 6px; font-size: 14px; color: #333; font-weight: 500; }
  input {
    width: 100%;
    padding: 12px 16px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 15px;
    transition: border-color .2s;
    margin-bottom: 18px;
  }
  input:focus { outline: none; border-color: #1a237e; }
  button {
    width: 100%;
    padding: 14px;
    background: #1a237e;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s;
  }
  button:hover { background: #283593; }
  .error { color: #c62828; font-size: 13px; margin-top: 10px; text-align: center; display: none; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <img src="/logo.png" alt="LKL Gráfica">
    <p>Painel de Atendimento — Gráfica LKL</p>
  </div>
  <form id="loginForm">
    <label>E-mail</label>
    <input type="email" id="email" required placeholder="seu@email.com">
    <label>Senha</label>
    <input type="password" id="password" required placeholder="••••••••">
    <button type="submit" id="btn">Entrar</button>
    <p class="error" id="error">Credenciais inválidas. Tente novamente.</p>
  </form>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  btn.textContent = 'Entrando...';
  btn.disabled = true;

  const res = await fetch('/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      email: document.getElementById('email').value,
      password: document.getElementById('password').value,
    }),
  });

  if (res.ok) {
    window.location.href = '/dashboard';
  } else {
    document.getElementById('error').style.display = 'block';
    btn.textContent = 'Entrar';
    btn.disabled = false;
  }
});
</script>
</body>
</html>
